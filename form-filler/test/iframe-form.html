<!doctype html>
<html lang="en-GB">
<head><meta charset="utf-8"><title>Iframe form</title>
<style>body{font:14px system-ui,sans-serif;margin:8px} label{display:inline-block;min-width:120px}</style></head>
<body>
<form id="newsletter">
  <h3>Newsletter (iframe, EN-GB)</h3>
  <p><label for="n">Full name</label><input id="n" name="fullname"></p>
  <p><label for="e">Email</label><input id="e" name="email" type="email"></p>
  <p><label for="pc">Postcode</label><input id="pc" name="postcode"></p>
  <p><label><input type="checkbox" name="gdpr" required> I agree to the privacy policy</label></p>
</form>
</body>
</html>
