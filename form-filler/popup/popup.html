<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Form Filler</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon32.png" alt="" width="20" height="20">
    <h1 data-i18n="extName">Form Filler</h1>
    <button id="openOptions" class="icon" data-i18n-title="popupOptions" title="Options" aria-label="Options">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M19.14 12.94a7.07 7.07 0 0 0 0-1.88l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7 7 0 0 0-1.63-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.49.42l-.36 2.54a7.4 7.4 0 0 0-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.66 8.84a.5.5 0 0 0 .12.64l2.03 1.58a7.07 7.07 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.3.6.22l2.39-.96c.5.38 1.05.7 1.63.94l.36 2.54c.05.24.25.42.49.42h3.84c.25 0 .45-.18.5-.42l.36-2.54a7.4 7.4 0 0 0 1.63-.94l2.39.96c.22.08.47 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Z"/></svg>
    </button>
  </header>

  <section class="lang">
    <span class="label" data-i18n="popupDataLanguage">Data language</span>
    <div class="seg" role="radiogroup" id="locale">
      <button data-locale="auto" role="radio" data-i18n="popupAuto">Auto</button>
      <button data-locale="it" role="radio">IT</button>
      <button data-locale="en-US" role="radio">EN-US</button>
      <button data-locale="en-GB" role="radio">EN-GB</button>
    </div>
  </section>

  <section class="actions">
    <button id="fillPage" class="primary">
      <span data-i18n="popupFillPage">Fill page</span>
      <kbd>Alt+Shift+F</kbd>
    </button>
    <div class="row">
      <button id="fillForm"><span data-i18n="popupFillForm">Focused form</span></button>
      <button id="newIdentity"><span data-i18n="popupNewIdentity">New identity</span></button>
      <button id="clear" class="ghost"><span data-i18n="popupClear">Clear</span></button>
    </div>
    <label class="check">
      <input type="checkbox" id="keepIdentity">
      <span data-i18n="popupKeepIdentity">Keep same identity</span>
    </label>
  </section>

  <div id="status" class="status" role="status" aria-live="polite"></div>

  <section class="identity">
    <div class="identity-head">
      <h2 data-i18n="popupIdentity">Current identity</h2>
      <span class="hint" data-i18n="popupCopyHint">Click a value to copy it</span>
    </div>
    <dl id="persona"></dl>
    <p id="noPersona" class="empty" data-i18n="popupNoIdentity">Fill a page to generate an identity.</p>
  </section>

  <script src="../shared/settings.js"></script>
  <script src="../shared/runner.js"></script>
  <script src="popup.js"></script>
</body>
</html>
